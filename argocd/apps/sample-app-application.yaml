apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd
spec:
  project: default

  source:
    # Replace with your actual GitHub repo URL once pushed
    repoURL: https://github.com/debmalya-acharjee/gitops-eks-platform.git
    targetRevision: main
    path: apps/sample-api/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api

  syncPolicy:
    automated:
      prune: true      # deletes resources removed from Git
      selfHeal: true    # reverts manual kubectl changes back to Git state
    syncOptions:
      - CreateNamespace=true
