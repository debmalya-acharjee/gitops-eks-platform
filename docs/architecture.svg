<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">GitOps Platform on Amazon EKS — Architecture</text>

  <!-- Developer -->
  <rect x="30" y="70" width="140" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" font-size="13" fill="#1a1a1a">Developer</text>
  <text x="100" y="113" text-anchor="middle" font-size="11" fill="#555">git push</text>

  <!-- GitHub repo -->
  <rect x="230" y="70" width="150" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="305" y="95" text-anchor="middle" font-size="13" fill="#1a1a1a">GitHub</text>
  <text x="305" y="113" text-anchor="middle" font-size="11" fill="#555">source + manifests</text>

  <!-- GitHub Actions -->
  <rect x="440" y="70" width="160" height="60" rx="8" fill="#eafaf1" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="95" text-anchor="middle" font-size="13" fill="#1a1a1a">GitHub Actions</text>
  <text x="520" y="113" text-anchor="middle" font-size="11" fill="#555">build · push · commit tag</text>

  <!-- ECR -->
  <rect x="660" y="70" width="150" height="60" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="735" y="95" text-anchor="middle" font-size="13" fill="#1a1a1a">Amazon ECR</text>
  <text x="735" y="113" text-anchor="middle" font-size="11" fill="#555">container images</text>

  <!-- OIDC note -->
  <text x="520" y="150" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Auth via GitHub OIDC — no long-lived AWS keys</text>

  <!-- Arrows top row -->
  <line x1="170" y1="100" x2="228" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="100" x2="438" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="100" x2="658" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- commit back to git arrow (curved) -->
  <path d="M 520 130 C 520 175, 305 175, 305 132" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="410" y="185" text-anchor="middle" font-size="10" fill="#16a34a">commits new image tag back to Git</text>

  <!-- ArgoCD -->
  <rect x="230" y="230" width="150" height="60" rx="8" fill="#fdeef4" stroke="#db2777" stroke-width="1.5"/>
  <text x="305" y="255" text-anchor="middle" font-size="13" fill="#1a1a1a">ArgoCD</text>
  <text x="305" y="273" text-anchor="middle" font-size="11" fill="#555">watches Git, auto-syncs</text>

  <!-- arrow github -> argocd -->
  <line x1="305" y1="132" x2="305" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="185" font-size="10" fill="#888" text-anchor="start"></text>

  <!-- arrow argocd -> ECR pull -->
  <path d="M 380 260 C 550 260, 650 200, 735 132" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="560" y="220" text-anchor="middle" font-size="10" fill="#888">pulls image</text>

  <!-- EKS Cluster boundary -->
  <rect x="150" y="340" width="700" height="230" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="170" y="365" font-size="13" font-weight="bold" fill="#333">Amazon EKS Cluster (VPC — 2 AZs, private subnets)</text>

  <!-- arrow argocd -> cluster -->
  <line x1="305" y1="292" x2="305" y2="338" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="320" font-size="10" fill="#888">deploys / reconciles</text>

  <!-- sample-api pods -->
  <rect x="200" y="400" width="180" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="290" y="425" text-anchor="middle" font-size="13" fill="#1a1a1a">sample-api</text>
  <text x="290" y="443" text-anchor="middle" font-size="11" fill="#555">2+ pods (HPA 2-5)</text>
  <text x="290" y="461" text-anchor="middle" font-size="11" fill="#555">/healthz · /metrics</text>

  <!-- Prometheus/Grafana -->
  <rect x="460" y="400" width="220" height="90" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="570" y="425" text-anchor="middle" font-size="13" fill="#1a1a1a">Prometheus + Grafana</text>
  <text x="570" y="443" text-anchor="middle" font-size="11" fill="#555">scrapes /metrics</text>
  <text x="570" y="461" text-anchor="middle" font-size="11" fill="#555">dashboards + alerting</text>

  <!-- arrow sample-api -> prometheus -->
  <line x1="380" y1="445" x2="458" y2="445" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ALB -->
  <rect x="200" y="510" width="180" height="45" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="537" text-anchor="middle" font-size="12" fill="#1a1a1a">ALB (Ingress)</text>

  <line x1="290" y1="508" x2="290" y2="492" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)"/>

  <!-- Legend -->
  <text x="170" y="600" font-size="10" fill="#888">Solid arrows = direct request/deploy flow · Dashed arrows = async / pull-based flow</text>
</svg>
